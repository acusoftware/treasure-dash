<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TREASURE DASH</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  overflow: hidden;
  background: #123b35;
  font-family: Arial, sans-serif;
  touch-action: manipulation;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
}

#jumpButton {
  position: fixed;
  right: 20px;
  bottom: 25px;
  width: 95px;
  height: 95px;
  border: 4px solid white;
  border-radius: 50%;
  background: #ffbb22;
  color: #382300;
  font-size: 20px;
  font-weight: bold;
  z-index: 10;
}

#hint {
  position: fixed;
  bottom: 130px;
  right: 15px;
  color: white;
  font-weight: bold;
  text-shadow: 1px 1px 3px black;
}

</style>
</head>

<body>

<canvas id="game"></canvas>

<button id="jumpButton">ZIPLA!</button>
<div id="hint">Zıplamak için dokun!</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let ground = 0;

let player;
let obstacles = [];
let coins = [];

let score = 0;
let gold = 0;
let speed = 5;

let running = false;
let gameOver = false;
let lastTime = 0;
let spawnTimer = 0;

function resize() {
  const ratio = Math.min(window.devicePixelRatio || 1, 2);

  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = Math.floor(W * ratio);
  canvas.height = Math.floor(H * ratio);

  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

  ground = H * 0.80;

  if (player) {
    player.x = W * 0.18;
    player.y = Math.min(player.y, ground - player.h);
  }
}

window.addEventListener("resize", resize);
resize();

function resetGame() {
  player = {
    x: W * 0.18,
    y: ground - 55,
    w: 38,
    h: 55,
    vy: 0
  };

  obstacles = [];
  coins = [];

  score = 0;
  gold = 0;
  speed = 5;
  spawnTimer = 0;

  running = true;
  gameOver = false;
}

function jump() {
  if (gameOver || !running) {
    resetGame();
    return;
  }

  if (player.y >= ground - player.h - 2) {
    player.vy = -13;
  }
}

document.getElementById("jumpButton").addEventListener("pointerdown", function(e) {
  e.preventDefault();
  jump();
});

canvas.addEventListener("pointerdown", function(e) {
  e.preventDefault();
  jump();
});

window.addEventListener("keydown", function(e) {
  if (e.code === "Space" || e.code === "ArrowUp") {
    e.preventDefault();
    jump();
  }
});
  function drawBackground() {
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#1685a5");
  sky.addColorStop(1, "#9ae6a1");

  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Güneş
  ctx.fillStyle = "#ffe77a";
  ctx.beginPath();
  ctx.arc(W * 0.80, H * 0.17, 35, 0, Math.PI * 2);
  ctx.fill();

  // Dağlar
  ctx.fillStyle = "#397c69";
  ctx.beginPath();
  ctx.moveTo(0, ground);
  ctx.lineTo(W * 0.25, H * 0.35);
  ctx.lineTo(W * 0.48, ground);
  ctx.lineTo(W * 0.72, H * 0.40);
  ctx.lineTo(W, ground);
  ctx.closePath();
  ctx.fill();

  // Yol
  ctx.fillStyle = "#b98b55";
  ctx.fillRect(0, ground, W, H - ground);

  ctx.fillStyle = "#3b9a43";
  ctx.fillRect(0, ground - 8, W, 12);

  // Yol işaretleri
  ctx.fillStyle = "#f5d39a";

  for (let i = 0; i < W + 60; i += 65) {
    let x = (i - score * 3 % 65);

    ctx.fillRect(x, ground + 35, 30, 5);
  }
}

function drawPlayer() {
  // Gölge
  ctx.fillStyle = "rgba(0,0,0,0.2)";
  ctx.beginPath();
  ctx.ellipse(
    player.x + player.w / 2,
    ground + 2,
    24,
    6,
    0,
    0,
    Math.PI * 2
  );
  ctx.fill();

  // Bacaklar
  ctx.fillStyle = "#273e7a";
  ctx.fillRect(player.x + 4, player.y + 43, 12, 15);
  ctx.fillRect(player.x + 23, player.y + 43, 12, 15);

  // Gövde
  ctx.fillStyle = "#ff7139";
  ctx.fillRect(player.x + 3, player.y + 20, 32, 28);

  // Kafa
  ctx.fillStyle = "#ffd0a1";
  ctx.beginPath();
  ctx.arc(player.x + 19, player.y + 12, 14, 0, Math.PI * 2);
  ctx.fill();

  // Saç
  ctx.fillStyle = "#573621";
  ctx.fillRect(player.x + 6, player.y - 1, 26, 8);

  // Göz
  ctx.fillStyle = "#222";
  ctx.fillRect(player.x + 25, player.y + 9, 3, 4);
}

function drawCoin(c) {
  ctx.fillStyle = "#ffbf00";
  ctx.beginPath();
  ctx.arc(c.x, c.y, 12, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = "#fff2a6";
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.fillStyle = "#8b5b00";
  ctx.font = "bold 15px Arial";
  ctx.textAlign = "center";
  ctx.fillText("$", c.x, c.y + 5);
}

function drawObstacle(o) {
  ctx.fillStyle = "#80502e";
  ctx.fillRect(o.x, o.y, o.w, o.h);

  ctx.fillStyle = "#b77a45";
  ctx.fillRect(o.x + 5, o.y + 5, o.w - 10, 8);

  ctx.fillStyle = "#57351f";
  ctx.fillRect(o.x + 4, o.y + o.h - 7, o.w - 8, 5);
}

function drawHUD() {
  ctx.textAlign = "left";
  ctx.font = "bold 22px Arial";
  ctx.fillStyle = "white";

  ctx.fillText("SKOR: " + Math.floor(score), 15, 32);

  ctx.fillStyle = "#ffe06b";
  ctx.fillText("ALTIN: " + gold, 15, 62);

  ctx.textAlign = "center";
  ctx.font = "bold 23px Arial";
  ctx.fillStyle = "white";

  ctx.fillText("TREASURE DASH", W / 2, H * 0.12);
}

function drawStartScreen() {
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = "center";

  ctx.fillStyle = "#ffdf54";
  ctx.font = "bold 34px Arial";
  ctx.fillText("TREASURE DASH", W / 2, H * 0.38);

  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("Altınları topla!", W / 2, H * 0.46);
  ctx.fillText("Başlamak için ekrana dokun", W / 2, H * 0.53);
}

function drawGameOver() {
  ctx.fillStyle = "rgba(0,0,0,0.72)";
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = "center";

  ctx.fillStyle = "#ffdf54";
  ctx.font = "bold 36px Arial";
  ctx.fillText("OYUN BİTTİ!", W / 2, H * 0.38);

  ctx.fillStyle = "white";
  ctx.font = "22px Arial";
  ctx.fillText("Skor: " + Math.floor(score), W / 2, H * 0.47);
  ctx.fillText("Altın: " + gold, W / 2, H * 0.53);

  ctx.font = "bold 19px Arial";
  ctx.fillText("Tekrar oynamak için dokun!", W / 2, H * 0.62);
  }
  function spawnObjects() {
  const obstacleHeight = 35 + Math.random() * 10;

  obstacles.push({
    x: W + 30,
    y: ground - obstacleHeight,
    w: 32,
    h: obstacleHeight
  });

  const coinY = ground - 75 - Math.random() * 60;

  for (let i = 0; i < 3; i++) {
    coins.push({
      x: W + 100 + i * 35,
      y: coinY,
      r: 12,
      collected: false
    });
  }
}

function collide(a, b) {
  return (
    a.x < b.x + b.w &&
    a.x + a.w > b.x &&
    a.y < b.y + b.h &&
    a.y + a.h > b.y
  );
}

function update(dt) {
  if (!running || gameOver) return;

  const factor = Math.min(dt / 16.67, 2);

  score += 0.12 * factor;
  speed = Math.min(10, 5 + score / 150);

  // Zıplama ve yer çekimi
  player.vy += 0.65 * factor;
  player.y += player.vy * factor;

  if (player.y + player.h >= ground) {
    player.y = ground - player.h;
    player.vy = 0;
  }

  // Yeni nesneler
  spawnTimer += dt;

  if (spawnTimer > Math.max(700, 1400 - speed * 60)) {
    spawnObjects();
    spawnTimer = 0;
  }

  // Engeller
  for (const o of obstacles) {
    o.x -= speed * factor;

    if (collide(player, o)) {
      gameOver = true;
      running = false;
    }
  }

  obstacles = obstacles.filter(o => o.x + o.w > 0);

  // Altınlar
  for (const c of coins) {
    c.x -= speed * factor;

    const box = {
      x: c.x - c.r,
      y: c.y - c.r,
      w: c.r * 2,
      h: c.r * 2
    };

    if (!c.collected && collide(player, box)) {
      c.collected = true;
      gold++;
      score += 10;
    }
  }

  coins = coins.filter(c => c.x + c.r > 0 && !c.collected);
}

function draw() {
  drawBackground();

  for (const c of coins) {
    drawCoin(c);
  }

  for (const o of obstacles) {
    drawObstacle(o);
  }

  if (player) {
    drawPlayer();
  }

  drawHUD();

  if (!running && !gameOver) {
    drawStartScreen();
  }

  if (gameOver) {
    drawGameOver();
  }
}

function loop(time) {
  const dt = lastTime ? Math.min(time - lastTime, 40) : 16;

  lastTime = time;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

// Oyunu başlatmaya hazırla
player = {
  x: W * 0.18,
  y: ground - 55,
  w: 38,
  h: 55,
  vy: 0
};

obstacles = [];
coins = [];

requestAnimationFrame(loop);
</script>

</body>
</html>
